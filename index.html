<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bump CACHE_GEN when you need every visitor to purge old browser/PWA cache once. -->
    <script>
      (function () {
        var VERSION_KEY = "murandasi_app_version";
        var GEN_KEY = "murandasi_cache_gen";
        var CACHE_GEN = "1";

        function purgeAndReload() {
          var tasks = [];
          if ("serviceWorker" in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }),
            );
          }
          if ("caches" in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }),
            );
          }
          Promise.all(tasks)
            .catch(function () {})
            .finally(function () {
              window.location.reload();
            });
        }

        function stripBustParam() {
          try {
            var url = new URL(window.location.href);
            if (!url.searchParams.has("_")) return;
            url.searchParams.delete("_");
            window.history.replaceState(null, "", url.pathname + url.search + url.hash);
          } catch (e) {}
        }

        try {
          stripBustParam();

          if (localStorage.getItem(GEN_KEY) !== CACHE_GEN) {
            localStorage.setItem(GEN_KEY, CACHE_GEN);
            purgeAndReload();
            return;
          }

          fetch("/version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
              if (!data || !data.version) return;
              var prev = localStorage.getItem(VERSION_KEY);
              if (prev && prev !== data.version) {
                localStorage.setItem(VERSION_KEY, data.version);
                window.location.reload();
              } else if (!prev) {
                localStorage.setItem(VERSION_KEY, data.version);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <title>Murandasi Shop — Electronics Made Simple</title>

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E0E6A" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("murandasi_theme");
          var dark =
            saved === "dark" ||
            (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#0c0c24");
          }
        } catch (e) {}
      })();
    </script>
